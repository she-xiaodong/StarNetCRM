version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: starnet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: starnet123
      MYSQL_DATABASE: starnet_crm
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  neo4j:
    image: neo4j:5.18-community
    container_name: starnet-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_heap_max__size: 512M
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs

  redis:
    image: redis:7-alpine
    container_name: starnet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: starnet-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - neo4j
      - redis
    environment:
      CONFIG_PATH: config.yaml

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: starnet-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  neo4j-data:
  neo4j-logs:
  redis-data:
